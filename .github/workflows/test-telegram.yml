name: Test Telegram

on:
  workflow_dispatch:
    inputs:
      watch:
        description: "Watch id to test (leave blank to send one sample per watch)"
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Passed via env rather than inlined into the run script, so the input
          # can't be interpreted as shell. Unquoted below so blank means "no arg".
          WATCH: ${{ inputs.watch }}
        run: python send_test_message.py $WATCH
